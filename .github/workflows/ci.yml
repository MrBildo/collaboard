name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/*']

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/Collaboard.sln
      - name: Format
        # --severity error: the gate enforces exactly the editorconfig's :error
        # rules (the errors-or-quiet model the analyzer adoption is built on).
        # Default severity (warn) would also fail on the deferred warning-level
        # nudges, which belong to the separate recurring suggestion-resolution
        # gate, not this gate (#208).
        run: dotnet format backend/Collaboard.sln --verify-no-changes --no-restore --severity error
      - name: Build
        run: dotnet build backend/Collaboard.sln --no-restore --no-incremental
      - name: Test
        run: dotnet test backend/ --no-build --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Format check
        run: npm run format:check
        working-directory: frontend
      - name: Type check
        run: npx tsc -b
        working-directory: frontend
      - name: Test
        run: npm run test
        working-directory: frontend
      - name: Build
        run: npx vite build
        working-directory: frontend
