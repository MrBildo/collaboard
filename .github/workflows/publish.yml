name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  extract-version:
    name: Extract version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Parse tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # SemVer 2.0 §9 pre-release identifier: dot-separated alphanumerics
          # (and hyphens). Examples: v1.10.0, v1.10.1-rc1, v2.0.0-beta.3,
          # v2.0.0-alpha.1.beta. Build metadata (+...) is intentionally NOT
          # accepted -- VERSION becomes a path segment in archive filenames and
          # a '+' there is friction across tools (URL-encoding, shell quoting,
          # the GitHub asset name). Rejecting it before any build leg runs is
          # the whole point of this gate. If we ever need build-metadata tags,
          # revisit then. Mirrors Collabhost publish.yml's extract-version job.
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag '${TAG}' does not match vX.Y.Z or vX.Y.Z-<pre-release> (per SemVer 2.0 §9)." >&2
            echo "Build metadata (+meta) and non-SemVer tags are rejected." >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build ${{ matrix.rid }}
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact: collaboard-win-x64
            bin: Collaboard.Api.exe
            ext: zip
          - rid: osx-arm64
            artifact: collaboard-osx-arm64
            bin: Collaboard.Api
            ext: tar.gz
          - rid: osx-x64
            artifact: collaboard-osx-x64
            bin: Collaboard.Api
            ext: tar.gz
          - rid: linux-x64
            artifact: collaboard-linux-x64
            bin: Collaboard.Api
            ext: tar.gz
          - rid: linux-arm64
            artifact: collaboard-linux-arm64
            bin: Collaboard.Api
            ext: tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # CI validation
      - name: Restore backend
        run: dotnet restore backend/Collaboard.sln

      - name: Build backend
        run: dotnet build backend/Collaboard.sln --no-restore

      - name: Test backend
        run: dotnet test backend/ --no-build --verbosity normal

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check frontend
        run: npx tsc -b
        working-directory: frontend

      # Build frontend and copy to wwwroot so dotnet publish picks it up.
      - name: Build frontend
        run: npx vite build
        working-directory: frontend

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p backend/Collaboard.Api/wwwroot
          cp -r frontend/dist/* backend/Collaboard.Api/wwwroot/

      # Publish self-contained, non-single-file (directory layout). Self-contained
      # keeps the no-runtime-needed property; dropping single-file removes the
      # runtime native-lib self-extraction step entirely, which is the precondition
      # that fails under hardened/read-only-cwd hosting (Collaboard #231).
      - name: Publish
        env:
          VER: ${{ needs.extract-version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet publish backend/Collaboard.Api/Collaboard.Api.csproj \
            -c Release \
            -r "${RID}" \
            --self-contained \
            /p:Version="${VER}" \
            -o "publish/${{ matrix.artifact }}"

      # Explicit archive contract: an exclusion list (strip known-bad patterns)
      # backed by a top-level allow-list (fail on anything unrecognized).
      #
      # Collaboard ships a directory-layout self-contained publish (~380 files:
      # the apphost binary plus the entire .NET runtime as loose DLLs and native
      # libs). A per-FILE allow-list -- the shape Collabhost's single-file publish
      # uses -- is the wrong tool here: enumerating 350+ runtime DLLs is
      # unmaintainable and self-defeating. So the baseline contract is "everything
      # dotnet publish emits, MINUS a small, named set of dev/debug/SDK-scratch
      # artifacts that must never reach an operator." The exclusion list below IS
      # that contract boundary; the verify step fails the leg if any excluded
      # pattern survives staging or any required item is absent.
      #
      # Exclusion alone has one soft spot: a GENUINELY NOVEL SDK-added file (e.g.
      # a hypothetical future *.staticwebassets.runtime.json) matches none of the
      # excluded patterns, so it survives staging and ships. An exclusion list
      # passes unknown files by default; an allow-list would reject them. The
      # verify step closes this with a top-level allow-list keyed on the one
      # observation that makes a per-file list tractable: the runtime DLL/native
      # set drifts only at the TOP level, and that top level is a small set of
      # stable CLASSES (managed/native libraries) plus a short named set of
      # non-library artifacts. Class patterns absorb the ~350 libraries without
      # enumerating them; anything at the top level outside those classes and the
      # named set fails the verify -- restoring allow-list-grade drift detection.
      #
      # Excluded (and why):
      #   *.pdb                              debug symbols -- not shipped
      #   *.xml                              XML doc files (Api/ServiceDefaults) -- not shipped
      #   appsettings.Development.json       dev-only config -- never ships to operators
      #   *.staticwebassets.endpoints.json   MapStaticAssets manifest. Collaboard serves
      #                                      wwwroot via UseStaticFiles + MapFallbackToFile,
      #                                      NOT MapStaticAssets, so this manifest is unused
      #                                      at runtime. This is the exact SDK-drift file the
      #                                      archive contract exists to catch (#221 cite).
      #
      # The strip uses recursive `find ... -delete` so it shares one matcher with
      # the recursive `find .` leaked-file check in the verify step -- the two
      # halves of the exclusion contract must agree on what they match.
      - name: Stage archive
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail

          PUB="publish/${{ matrix.artifact }}"
          STAGE="archive-stage/${{ matrix.artifact }}"

          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"

          # Start from the full publish output, then strip the excluded set.
          cp -R "${PUB}/." "${STAGE}/"

          # Recursive strip -- mirrors the recursive `find .` matcher in the
          # verify step so both halves of the exclusion contract agree.
          find "${STAGE}" -type f \
            \( -name '*.pdb' \
            -o -name '*.xml' \
            -o -name 'appsettings.Development.json' \
            -o -name '*.staticwebassets.endpoints.json' \) \
            -delete

          # Bundle INSTALL.md alongside the binary (operator-facing setup guide).
          cp INSTALL.md "${STAGE}/"

          # Unix archives must carry the execute bit on the apphost binary.
          if [[ "${RID}" != win-x64 ]]; then
            chmod +x "${STAGE}/${{ matrix.bin }}"
          fi

          echo "Staged top-level contents:"
          ls -la "${STAGE}"

      # Platform-appropriate, FLAT-layout archive. The archive root IS the stage
      # directory's contents -- no wrapping "collaboard-<rid>/" directory. The
      # installer scripts (install.sh, install.ps1) and INSTALL.md assume the
      # binary and appsettings.json sit at the extract root. tar -C STAGE . and
      # Compress-Archive "$STAGE/*" both flatten; the verify step locks it.
      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $stage = "archive-stage/${{ matrix.artifact }}"
          Compress-Archive -Path "$stage/*" `
                           -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          set -euo pipefail
          STAGE="archive-stage/${{ matrix.artifact }}"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C "${STAGE}" .

      # Contract verification: extract the archive into a temp dir and assert
      # (1) flat layout -- no wrapping directory at the root;
      # (2) required items present -- binary, appsettings.json, runtimeconfig,
      #     deps.json, INSTALL.md, wwwroot/index.html;
      # (3) NO excluded patterns leaked through -- .pdb, .xml,
      #     appsettings.Development.json, *.staticwebassets.endpoints.json;
      # (4) NO unrecognized top-level entry -- the allow-list drift check. Every
      #     top-level entry must match a known library CLASS (managed/native libs)
      #     or the short named set of non-library artifacts. A genuinely novel
      #     SDK-added file at the top level matches neither and fails the leg.
      # Fails the leg hard on any violation. Cheap safety net for a workflow that
      # cannot be release-run inside a PR.
      - name: Verify archive contents
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail

          ARCHIVE="${{ matrix.artifact }}.${EXT}"
          VERIFY_DIR="verify-${{ matrix.rid }}"

          rm -rf "${VERIFY_DIR}"
          mkdir -p "${VERIFY_DIR}"

          case "${ARCHIVE}" in
            *.zip)    unzip -q "${ARCHIVE}" -d "${VERIFY_DIR}" ;;
            *.tar.gz) tar -xzf "${ARCHIVE}" -C "${VERIFY_DIR}" ;;
          esac

          echo "Archive top-level listing:"
          (cd "${VERIFY_DIR}" && ls -la)

          FAILED=0

          # (1) Flat-layout assertion: the apphost binary must be at the archive
          # root, not nested under a wrapping "collaboard-<rid>/" directory.
          if [[ -d "${VERIFY_DIR}/${{ matrix.artifact }}" ]]; then
            echo "LAYOUT: found wrapping directory ${{ matrix.artifact }}/ at archive root." >&2
            echo "Archives must be flat (contract items at root). Installers assume flat layout." >&2
            FAILED=1
          fi

          # (2) Required items present.
          for path in \
            "${{ matrix.bin }}" \
            "appsettings.json" \
            "Collaboard.Api.deps.json" \
            "Collaboard.Api.runtimeconfig.json" \
            "INSTALL.md"
          do
            if [[ ! -f "${VERIFY_DIR}/${path}" ]]; then
              echo "MISSING: ${path}" >&2
              FAILED=1
            fi
          done

          if [[ ! -f "${VERIFY_DIR}/wwwroot/index.html" ]]; then
            echo "MISSING: wwwroot/index.html" >&2
            FAILED=1
          fi

          # (3) Excluded patterns must NOT be present anywhere in the archive.
          # This is the "fails on EXTRA files" half of the contract -- it catches
          # dev/debug artifacts and future SDK-added-file drift leaking into a
          # shipped archive.
          LEAKED=$(cd "${VERIFY_DIR}" && find . \
            \( -name '*.pdb' \
            -o -name '*.xml' \
            -o -name 'appsettings.Development.json' \
            -o -name '*.staticwebassets.endpoints.json' \) \
            -type f | sort || true)
          if [[ -n "${LEAKED}" ]]; then
            echo "EXTRA (excluded artifact leaked into archive):" >&2
            echo "${LEAKED}" >&2
            FAILED=1
          fi

          # (4) Top-level allow-list drift check. The exclusion list (3) only
          # rejects KNOWN-bad patterns; an exclusion list passes unknown files by
          # default. This check restores allow-list-grade detection: every entry
          # at the archive top level must match a recognized library class or the
          # short named set of non-library artifacts. A genuinely novel SDK-added
          # file (e.g. a future *.staticwebassets.runtime.json) matches neither
          # and is reported. The classes absorb the ~350 runtime libraries so the
          # list stays tractable without enumerating individual DLL names; only
          # the top level drifts (the runtime set itself is stable per-RID).
          #
          # Recognized top-level CLASSES (patterns):
          #   *.dll      managed assemblies + Windows native runtime libs
          #   *.so       Linux native runtime libs
          #   *.dylib    macOS native runtime libs
          # Recognized top-level NAMED entries:
          #   <bin>                            apphost binary (RID-specific name)
          #   createdump / createdump.exe      .NET crash-dump helper (self-contained)
          #   appsettings.json                 shipped operator config
          #   Collaboard.Api.deps.json         dependency manifest (runtime-load-bearing)
          #   Collaboard.Api.runtimeconfig.json runtime config (runtime-load-bearing)
          #   INSTALL.md                       bundled operator setup guide
          #   wwwroot                          SPA static assets (directory)
          #   web.config                       Windows-only ASP.NET Core hosting config
          #                                    (IIS / in-process model -- emitted by the
          #                                    win-x64 self-contained publish only; the
          #                                    other RIDs do not produce it)
          UNRECOGNIZED=$(cd "${VERIFY_DIR}" && \
            for entry in *; do
              case "${entry}" in
                *.dll|*.so|*.dylib) ;;
                "${{ matrix.bin }}") ;;
                createdump|createdump.exe) ;;
                appsettings.json) ;;
                Collaboard.Api.deps.json) ;;
                Collaboard.Api.runtimeconfig.json) ;;
                INSTALL.md) ;;
                wwwroot) ;;
                web.config) ;;
                *) echo "${entry}" ;;
              esac
            done | sort)
          if [[ -n "${UNRECOGNIZED}" ]]; then
            echo "DRIFT (unrecognized top-level entry -- not a known library class or named artifact):" >&2
            echo "${UNRECOGNIZED}" >&2
            echo "If this is a legitimate new shipped artifact, add it to the top-level allow-list in this step." >&2
            echo "If it is SDK scratch that must not ship, add it to the exclusion list in the Stage archive step." >&2
            FAILED=1
          fi

          if [[ "${FAILED}" -ne 0 ]]; then
            echo "Archive contract verification failed." >&2
            exit 1
          fi

          echo "Archive contract verified: flat layout, required items present, no excluded artifacts, no top-level drift."

      # Per-archive SHA-256 sidecar. Portable `sha256sum -c`-compatible format
      # (one line: "<hash>  <archive>"). Runners are ubuntu-latest, so sha256sum
      # is always present; the shasum fallback is defensive in case a future leg
      # moves to a macOS/Windows runner.
      - name: Checksum
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          ARCHIVE="${{ matrix.artifact }}.${EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          cat "${ARCHIVE}.sha256"

      # Upload archive + per-archive checksum to the GitHub Release that
      # triggered this workflow. --clobber makes matrix re-runs idempotent.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            "${{ matrix.artifact }}.${EXT}" \
            "${{ matrix.artifact }}.${EXT}.sha256" \
            --repo "${{ github.repository }}" \
            --clobber

      # Per-leg checksum artifact for the aggregation job.
      - name: Upload per-leg checksum artifact
        uses: actions/upload-artifact@v5
        with:
          name: checksum-${{ matrix.rid }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}.sha256
          retention-days: 7

  publish-checksums:
    name: Aggregate checksums.txt
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download per-leg checksums
        uses: actions/download-artifact@v5
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums-in

      - name: Aggregate
        run: |
          set -euo pipefail

          # Normalize to text-mode format: strip any leading '*' from the
          # filename column. sha256sum on Git-Bash (Windows runners) defaults to
          # binary mode and emits "<hash>  *<filename>", while Linux/macOS emit
          # "<hash>  <filename>". All current legs run on ubuntu-latest so no '*'
          # is expected, but normalizing keeps checksums.txt uniform if a leg
          # ever moves to a Windows runner -- one format for human operators and
          # for `sha256sum -c`.
          cat checksums-in/*.sha256 | sed 's/  \*/  /' | sort -k2 > checksums.txt
          echo "Aggregated checksums.txt:"
          cat checksums.txt

      - name: Upload aggregated checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber
